<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF3C4">
<title>AXO PUZZLE — el puzzle de los ajolotes</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
background:linear-gradient(180deg,#FFF6D8 0%,#FCEFB8 60%,#FBE8A8 100%);color:#6B4A2F;overflow:hidden;
user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:7px}
header{display:flex;align-items:center;gap:9px}
#logo{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 2px 8px rgba(180,120,60,.35);border:2px solid #fff}
h1{font-size:22px;margin:0;letter-spacing:1.5px;color:#E2548B;text-shadow:0 1px 0 #fff}
.sub{font-size:11px;color:#A07B54;font-weight:600}
#langBtn{margin-left:auto;background:#fff;border:2px solid #F0DCA8;border-radius:999px;padding:6px 12px;
font-weight:800;color:#B07B3F;font-size:13px;cursor:pointer;box-shadow:0 2px 5px rgba(180,130,60,.2)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#fff;border-radius:14px;padding:5px 4px;text-align:center;box-shadow:0 2px 8px rgba(180,130,60,.18);border:2px solid #F7E8BE}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#B89B6D;font-weight:800}
.stat .v{font-size:19px;font-weight:900;color:#6B4A2F}
.counters{display:flex;gap:8px;justify-content:center}
.pill{background:#fff;border-radius:999px;padding:5px 16px 5px 8px;display:flex;align-items:center;gap:7px;
font-weight:900;font-size:16px;box-shadow:0 2px 8px rgba(180,130,60,.18);border:2px solid #F7E8BE;color:#6B4A2F}
.pill img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#fff}
.pill .fish{font-size:20px}
.rules{display:flex;gap:6px}
.rule{flex:1;background:#FFFDF4;border:2px solid #F3E0AC;border-radius:12px;padding:6px 3px 5px;font-size:9.5px;
text-align:center;font-weight:700;color:#8A6D4B;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini{display:grid;grid-template-columns:repeat(3,11px);grid-template-rows:repeat(3,11px);gap:1.5px}
.mini div{border-radius:3px;position:relative}
.mini img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff}
.mini .ban{position:absolute;inset:-2px;display:flex;align-items:center;justify-content:center;color:#E23E57;font-weight:900;font-size:15px}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#board{width:min(100%,50dvh);aspect-ratio:1/1;display:grid;gap:3px;background:#fff;padding:9px;border-radius:20px;
box-shadow:0 8px 22px rgba(180,130,60,.28);border:3px solid #fff}
.cell{border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}
.cell .tok{width:90%;height:90%;border-radius:50%;background:#fff;object-fit:cover;
box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.cell.given .tok{box-shadow:0 0 0 2.5px #F5B942,0 2px 5px rgba(0,0,0,.25)}
.cell.x::after{content:"\2715";font-weight:900;color:#8A6D4B;font-size:clamp(14px,5vw,22px);animation:pop .2s}
.cell.clue{box-shadow:inset 0 0 0 2.5px #E2548B}
.cell.clue::after{content:"?";color:#E2548B;font-weight:900;font-size:clamp(16px,6vw,26px);animation:blink 1.3s infinite}
.cell.conflict{animation:shake .32s}
.cell.conflict .tok{box-shadow:0 0 0 3px #E23E57,0 2px 5px rgba(0,0,0,.25)}
.cell.conflict{box-shadow:inset 0 0 0 2.5px #E23E57}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.controls{display:flex;gap:12px;justify-content:center;align-items:center}
.cbtn{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:#fff;cursor:pointer;position:relative;
box-shadow:0 4px 12px rgba(180,130,60,.3);font-size:24px;display:flex;align-items:center;justify-content:center;color:#8A6D4B}
.cbtn:active{transform:scale(.92)}
.cbtn.big{width:78px;height:78px;background:linear-gradient(180deg,#FFE9F2,#FFD3E4);border-color:#FF9FC0}
.cbtn.big img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#fff;pointer-events:none}
.cbtn.big .plus{position:absolute;top:-4px;right:-4px;background:#4CAF6D;color:#fff;width:26px;height:26px;border-radius:50%;
font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none}
.cbtn.active{outline:3px solid #E2548B}
.cbtn .badge{position:absolute;top:-6px;right:-6px;background:#E2548B;color:#fff;min-width:24px;height:24px;border-radius:12px;
font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}
.footer{display:flex;gap:8px}
.fbtn{flex:1;background:#fff;border:2px solid #F0DCA8;border-radius:14px;padding:9px;font-weight:800;color:#8A6D4B;
font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(180,130,60,.15)}
.fbtn.done{border-color:#4CAF6D;color:#2E7D4F}
.fbtn:active{transform:scale(.97)}
.modal{position:fixed;inset:0;background:rgba(90,60,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.show{display:flex}
.card{background:#FFFDF6;border-radius:24px;padding:24px 20px;max-width:340px;width:100%;text-align:center;
box-shadow:0 12px 40px rgba(0,0,0,.3);border:3px solid #F7E3AC;animation:cardin .35s cubic-bezier(.2,1.4,.4,1);max-height:92dvh;overflow-y:auto}
@keyframes cardin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.card h2{margin:8px 0 4px;color:#E2548B;font-size:24px}
.card p{font-size:14px;color:#8A6D4B;margin:6px 0}
#happyImg{width:130px;height:130px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #FFD3E4;
box-shadow:0 6px 18px rgba(226,84,139,.35)}
.bounce{animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#winStars{font-size:38px;letter-spacing:4px;margin:6px 0}
#winStars .on{color:#F5B942;text-shadow:0 2px 0 #fff;animation:starpop .4s backwards}
#winStars .off{color:#E4D5B5}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);display:inline-block}100%{transform:scale(1) rotate(0)}}
#winStars .on:nth-child(2){animation-delay:.18s}
#winStars .on:nth-child(3){animation-delay:.36s}
#winStats{font-size:15px;font-weight:700;color:#8A6D4B;margin:8px 0 14px;line-height:1.7}
.primary{display:block;width:100%;background:linear-gradient(180deg,#FF7FAE,#E2548B);color:#fff;border:none;border-radius:16px;
padding:13px;font-size:17px;font-weight:900;cursor:pointer;margin-top:6px;box-shadow:0 4px 12px rgba(226,84,139,.4)}
.primary:active{transform:scale(.97)}
.ghost{display:block;width:100%;background:#fff;color:#8A6D4B;border:2px solid #F0DCA8;border-radius:16px;
padding:10px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
.howstep{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid #F7E8BE;
border-radius:14px;padding:10px;margin:8px 0;font-size:13.5px;color:#6B4A2F}
.howstep .n{background:#E2548B;color:#fff;width:26px;height:26px;border-radius:50%;flex:none;display:flex;
align-items:center;justify-content:center;font-weight:900}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#6B4A2F;color:#FFF6D8;
padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .25s;z-index:70;pointer-events:none;
max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#floatLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floatScore{position:absolute;font-weight:900;color:#2E9D5B;font-size:18px;animation:floatup 1s forwards;text-shadow:0 1px 0 #fff}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
#testout{display:none;background:#222;color:#0f0;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;
max-height:180px;overflow:auto;white-space:pre-wrap}
body.test #testout{display:block}
body.test #boardWrap{flex:0 0 auto}
</style>
</head>

/* ================= puzzle generator =================
   1) Backtracking: place N non-touching axolotls, one per row/col (a permutation with king-adjacency ban).
   2) Grow N irregular regions, each seeded on exactly one solution cell (random flood fill).
   3) Count solutions with a solver capped at 2; keep the puzzle only if exactly 1.
   Fixing givens taken from the unique solution preserves uniqueness. */
function genSolution(N,rand){
  var cols=new Array(N).fill(-1),used=new Array(N).fill(false),ok=false;
  (function bt(r){
    if(ok)return;
    if(r===N){ok=true;return;}
    var order=shuffle(Array.from({length:N},function(_,i){return i;}),rand);
    for(var k=0;k<N&&!ok;k++){var c=order[k];
      if(used[c])continue;
      if(r>0&&Math.abs(c-cols[r-1])<=1)continue;
      cols[r]=c;used[c]=true;bt(r+1);
      if(!ok){used[c]=false;cols[r]=-1;}
    }
  })(0);
  return ok?cols.map(function(c,r){return {r:r,c:c};}):null;
}
function growRegions(N,sol,rand){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  function key(r,c){return r*N+c;}
  for(var att=0;att<80;att++){
    var reg=Array.from({length:N},function(){return new Array(N).fill(-1);});
    var front=Array.from({length:N},function(){return new Set();});
    sol.forEach(function(s,i){reg[s.r][s.c]=i;
      dirs.forEach(function(d){var nr=s.r+d[0],nc=s.c+d[1];
        if(nr>=0&&nr<N&&nc>=0&&nc<N)front[i].add(key(nr,nc));});});
    var assigned=N,guard=0,ok=true;
    var sizes=new Array(N).fill(1);
    while(assigned<N*N){
      if(guard++>N*N*6){ok=false;break;}
      var order=shuffle(Array.from({length:N},function(_,i){return i;}),rand),prog=false;
      for(var oi=0;oi<N;oi++){var i=order[oi];
        if(sizes[i]>=N||!front[i].size)continue;
        var arr=Array.from(front[i]);
        var kk=arr[(rand()*arr.length)|0];
        var r=(kk/N)|0,c=kk%N;
        if(reg[r][c]!==-1){front[i].delete(kk);continue;}
        reg[r][c]=i;assigned++;sizes[i]++;prog=true;front[i].delete(kk);
        for(var j=0;j<N;j++)front[j].delete(kk);
        dirs.forEach(function(d){var nr=r+d[0],nc=c+d[1];
          if(nr>=0&&nr<N&&nc>=0&&nc<N&&reg[nr][nc]===-1)front[i].add(key(nr,nc));});
      }
      if(!prog){ok=false;break;}
    }
    if(ok&&assigned===N*N)return reg;
  }

function countSolutions(N,reg,fixed,limit){
  var rowC=new Array(N).fill(-1);
  fixed.forEach(function(k){var p=k.split(',');rowC[+p[0]]=+p[1];});
  var colU=new Array(N).fill(false),regU=new Array(N).fill(false),placed=[],count=0;
  for(var r=0;r<N;r++){if(rowC[r]>=0){var c=rowC[r];colU[c]=true;regU[reg[r][c]]=true;placed.push({r:r,c:c});}}
  (function bt(r){
    if(count>=limit)return;
    if(r===N){count++;return;}
    if(rowC[r]>=0){bt(r+1);return;}
    for(var c=0;c<N;c++){
      if(colU[c]||regU[reg[r][c]])continue;
      var bad=false;
      for(var i=0;i<placed.length;i++){var p=placed[i];
        if(Math.abs(p.r-r)<=1&&Math.abs(p.c-c)<=1){bad=true;break;}}
      if(bad)continue;
      colU[c]=true;regU[reg[r][c]]=true;placed.push({r:r,c:c});
      bt(r+1);
      placed.pop();colU[c]=false;regU[reg[r][c]]=false;
      if(count>=limit)return;
    }

function findSolutions(N,reg,fixed,limit,exclude){
  var rowC=new Array(N).fill(-1);
  fixed.forEach(function(k){var p=k.split(',');rowC[+p[0]]=+p[1];});
  var colU=new Array(N).fill(false),regU=new Array(N).fill(false),placed=[],out=[];
  for(var r=0;r<N;r++){if(rowC[r]>=0){var c=rowC[r];colU[c]=true;regU[reg[r][c]]=true;placed.push({r:r,c:c});}}
  function sig(){return placed.map(function(p){return p.r+','+p.c;}).sort().join(';');}
  (function bt(r){
    if(out.length>=limit)return;
    if(r===N){var s=sig();if(!exclude||!exclude.has(s))out.push(s);return;}
    if(rowC[r]>=0){bt(r+1);return;}
    for(var c=0;c<N;c++){
      if(colU[c]||regU[reg[r][c]])continue;
      var bad=false;
      for(var i=0;i<placed.length;i++){var p=placed[i];
        if(Math.abs(p.r-r)<=1&&Math.abs(p.c-c)<=1){bad=true;break;}}
      if(bad)continue;
      colU[c]=true;regU[reg[r][c]]=true;placed.push({r:r,c:c});
      bt(r+1);
      placed.pop();colU[c]=false;regU[reg[r][c]]=false;
      if(out.length>=limit)return;
    }

function regionConnected(N,reg,g){
  var sr=-1,sc=-1,cnt=0;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(reg[r][c]===g){cnt++;if(sr<0){sr=r;sc=c;}}
  if(cnt===0)return false;

  while(stack.length){var p=stack.pop();n++;
    for(var d=0;d<4;d++){var nr=p[0]+dirs[d][0],nc=p[1]+dirs[d][1],k=nr*N+nc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N&&reg[nr][nc]===g&&!seen[k]){seen[k]=1;stack.push([nr,nc]);}}}

/* Hill-climbing repair: swap a boundary cell used by an alternative solution
   with a neighboring cell (both non-solution cells), keeping region sizes and
   connectivity. The swap is guaranteed to invalidate that alternative while
   the intended solution stays valid. Repeat until no alternative remains. */
function repairUniqueness(N,reg,intended,altSet,rand){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var cands=[];
  altSet.forEach(function(k){if(!intended.has(k))cands.push(k);});
  shuffle(cands,rand);
  for(var ci=0;ci<cands.length;ci++){
    var p=cands[ci].split(','),r=+p[0],c=+p[1],g=reg[r][c];
    var order=shuffle([0,1,2,3],rand);
    for(var di=0;di<4;di++){var d=dirs[order[di]];
      var nr=r+d[0],nc=c+d[1];
      if(nr<0||nr>=N||nc<0||nc>=N)continue;
      var h=reg[nr][nc];if(h===g)continue;
      var yk=nr+','+nc;
      if(intended.has(yk)||altSet.has(yk))continue;
      reg[r][c]=h;reg[nr][nc]=g;
      if(regionConnected(N,reg,g)&&regionConnected(N,reg,h))return true;

      if(used[c]||usedR.has(reg[r][c]))continue;
      if(r>0&&Math.abs(c-cols[r-1])<=1)continue;
      cols[r]=c;used[c]=true;usedR.add(reg[r][c]);bt(r+1,usedR);
      used[c]=false;usedR.delete(reg[r][c]);
    }
  })(0,new Set());
  return n;
}
function findGivens(N,reg,targetCols,maxG){
  var tkeys=targetCols.map(function(c,r){return r+','+c;});
  var givens=[];
  for(var g=0;g<maxG;g++){
    if(countSolsGivens(N,reg,givens,2)===1)break;
    var best=null,bestCnt=1e9;
    for(var i=0;i<tkeys.length;i++){
      var k=tkeys[i];
      if(givens.indexOf(k)>=0)continue;
      var test=givens.concat([k]);
      var c=countSolsGivens(N,reg,test,20);
      if(c<bestCnt){bestCnt=c;best=k;}
      if(c===1)break;
    }
    if(!best)break;
    givens.push(best);
    if(bestCnt===1)break;
  }
  return givens;
}
function generatePuzzle(N,nGivens,nClues,rand){
  var bestReg=null,bestSol=null,bestCnt=1e9;
  var K=N<=7?12:(N===8?10:16),maxG=N===9?10:8;
  for(var k=0;k<K;k++){
    var sol=genSolution(N,rand);if(!sol)continue;
    var reg=growRegions(N,sol,rand);if(!reg)continue;
    var cnt=countSolsGivens(N,reg,[],40);
    if(cnt<bestCnt){bestCnt=cnt;bestReg=reg;bestSol=sol;}
    if(cnt<=6)break;
  }
  if(!bestReg)return null;
  var pi=bestSol.map(function(s){return s.c;});
  var givens=findGivens(N,bestReg,pi,maxG);
  if(countSolsGivens(N,bestReg,givens,2)!==1)return null;
  var gset=new Set(givens);
  var keys=bestSol.map(function(s){return s.r+','+s.c;});
  var extra=shuffle(keys.filter(function(k){return !gset.has(k);}),rand);
  for(var i=0;i<extra.length&&gset.size<nGivens;i++)gset.add(extra[i]);
  var solSet=new Set(keys),nonSol=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var kk=r+','+c;if(!solSet.has(kk))nonSol.push(kk);}
  shuffle(nonSol,rand);
  return {N:N,regions:bestReg,solution:solSet,givens:gset,clues:new Set(nonSol.slice(0,nClues))};
}
function levelParams(n){
  if(n<=5)return {N:7,givens:5,clues:2};
  if(n<=10)return {N:8,givens:5,clues:1};
  if(n<=25)return {N:9,givens:4,clues:0};
  return {N:9,givens:0,clues:0};
}
</script>

<script>
'use strict';
/* ================= game state ================= */
var REG_COLORS=['#FFE08A','#FFC98B','#FFB3A0','#B9F0C8','#9FE8CF','#A9DDFB','#C4C1F5','#E3C6F2','#D9EFC2'];
var G=null,cellEls=[],undoStack=[],scoredCells=new Set(),clueOrig=new Set();
var mistakes=0,hintsUsed=0,axoMode=false,won=false,levelNum=1,isDaily=false;
var nextCache=null; // pregenerated next level

function loadLevel(n,daily){
  isDaily=!!daily;levelNum=n;won=false;undoStack=[];scoredCells=new Set();clueOrig=new Set();
  mistakes=0;hintsUsed=0;axoMode=false;$('#axoBtn').classList.remove('active');
  $('#winModal').classList.remove('show');
  var P=daily?{N:9,givens:2,clues:0}:levelParams(n);
  var seed=daily?hashStr('axo-daily-'+todayStr()):hashStr('axo-level-'+n);
  var puz=null;
  for(var rt=0;rt<6&&!puz;rt++)puz=generatePuzzle(P.N,P.givens,P.clues,mulberry32(seed+rt*7919));
  if(!puz){toast('Error');return;}
  G={N:P.N,regions:puz.regions,solution:puz.solution,locked:new Set(puz.givens),
     clueCells:new Set(puz.clues),board:Array.from({length:P.N},function(){return new Array(P.N).fill(0);})};
  puz.givens.forEach(function(k){var p=k.split(',');G.board[+p[0]][+p[1]]=1;});
  puz.clues.forEach(function(k){var p=k.split(','),r=+p[0],c=+p[1];G.board[r][c]=3;clueOrig.add(k);});
  buildBoard();updateCounters();updateHintBtn();updateDailyBtn();
  if(!daily&&!TEST)setTimeout(pregenNext,400);
}
function pregenNext(){
  try{
    var n=levelNum+1,P=levelParams(n);
    var seed=hashStr('axo-level-'+n),puz=null;
    for(var rt=0;rt<6&&!puz;rt++)puz=generatePuzzle(P.N,P.givens,P.clues,mulberry32(seed+rt*7919));
    if(puz)nextCache={n:n,P:P,puz:puz};
  }catch(e){}
}

/* ================= rendering ================= */
function buildBoard(){
  var b=$('#board');b.innerHTML='';
  b.style.gridTemplateColumns='repeat('+G.N+',1fr)';
  cellEls=[];
  for(var r=0;r<G.N;r++){cellEls.push([]);
    for(var c=0;c<G.N;c++){
      var d=document.createElement('div');
      d.className='cell'+(G.locked.has(r+','+c)?' given':'');
      d.style.background=REG_COLORS[G.regions[r][c]%REG_COLORS.length];
      attachCellHandlers(r,c,d);
      b.appendChild(d);cellEls[r].push(d);
    }}
  refreshAllCells();validate();
}
function refreshAllCells(){for(var r=0;r<G.N;r++)for(var c=0;c<G.N;c++)refreshCell(r,c);}
function refreshCell(r,c){
  var el=cellEls[r][c],v=G.board[r][c];
  el.classList.toggle('x',v===2);
  el.classList.toggle('clue',v===3);
  var img=el.querySelector('.tok');
  if(v===1){if(!img){img=document.createElement('img');img.className='tok';img.src=FACE_SRC;img.alt='';el.appendChild(img);}}
  else if(img){img.remove();}
}
function updateCounters(){
  var n=0;
  for(var r=0;r<G.N;r++)for(var c=0;c<G.N;c++)if(G.board[r][c]===1)n++;
  $('#axoCount').textContent=n+'/'+G.N;
  $('#fishCount').textContent=S.fish;
  $('#scoreVal').textContent=S.score;
  $('#streakVal').textContent=S.streak;
  $('#levelVal').textContent=isDaily?t('daily'):levelNum;
}
function updateHintBtn(){$('#hintCount').textContent=S.hints.count;}
function updateDailyBtn(){
  var b=$('#dailyBtn');
  if(S.daily[todayStr()])b.classList.add('done');
  else b.classList.remove('done');
}
function floatScore(txt){
  var layer=$('#floatLayer'),s=document.createElement('span');
  s.className='floatScore';s.textContent=txt;
  s.style.left=(20+Math.random()*60)+'%';s.style.top='18%';
  layer.appendChild(s);setTimeout(function(){s.remove();},1000);
}
function addScore(n,withFloat){S.score+=n;$('#scoreVal').textContent=S.score;if(withFloat)floatScore('+'+n);save();}
function toast(msg){
  var el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2200);
}

/* ================= interactions ================= */
function attachCellHandlers(r,c,el){
  var lpTimer=null,lpFired=false,sx=0,sy=0;
  el.addEventListener('pointerdown',function(e){
    ensureAudio();lpFired=false;sx=e.clientX;sy=e.clientY;
    clearTimeout(lpTimer);
    lpTimer=setTimeout(function(){lpFired=true;longPressCell(r,c);},550);
  });
  el.addEventListener('pointermove',function(e){
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>14)clearTimeout(lpTimer);
  });
  el.addEventListener('pointerup',function(){clearTimeout(lpTimer);if(!lpFired)tapCell(r,c);});
  el.addEventListener('pointercancel',function(){clearTimeout(lpTimer);});
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
function tapCell(r,c){
  if(won||!G)return;
  var k=r+','+c;
  if(G.locked.has(k))return;
  var v=G.board[r][c];
  if(v===3){revealClue(r,c);return;}
  if(axoMode){setCell(r,c,v===1?0:1);return;}
  if(v===0)setCell(r,c,2);       // empty -> X
  else if(v===2)setCell(r,c,1);   // X -> axolotl
  else setCell(r,c,0);            // axolotl -> empty
}
function longPressCell(r,c){
  if(won||!G)return;
  var k=r+','+c;
  if(G.locked.has(k))return;
  var v=G.board[r][c];
  if(v===3){revealClue(r,c);return;}
  setCell(r,c,v===1?0:1);
  if(navigator.vibrate){try{navigator.vibrate(15);}catch(e){}}
}
function revealClue(r,c){
  G.clueCells.delete(r+','+c);
  setCell(r,c,1);
  toast(t('clueFound'));
}
function setCell(r,c,val,opts){
  opts=opts||{};
  var prev=G.board[r][c];
  if(prev===val)return;
  G.board[r][c]=val;
  if(opts.record!==false)undoStack.push({r:r,c:c,prev:prev,next:val});
  var k=r+','+c;
  if(val===1){
    if(G.solution.has(k)&&!scoredCells.has(k)){scoredCells.add(k);addScore(10,true);}
    if(!G.solution.has(k))mistakes++;
    sfx('place');
  }else if(val===0){sfx('remove');}
  else if(val===2){sfx('tick');}
  refreshCell(r,c);
  validate();updateCounters();
  if(!opts.skipWin)checkWin();
}
function validate(){
  if(!G)return 0;
  var N=G.N,conf=new Set(),seenR={},seenC={},seenG={},axos=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    if(G.board[r][c]!==1)continue;
    var k=r+','+c,g=G.regions[r][c];
    axos.push({r:r,c:c,k:k});
    if(seenR[r]!==undefined){conf.add(k);conf.add(seenR[r]);}else seenR[r]=k;
    if(seenC[c]!==undefined){conf.add(k);conf.add(seenC[c]);}else seenC[c]=k;
    if(seenG[g]!==undefined){conf.add(k);conf.add(seenG[g]);}else seenG[g]=k;
  }
  for(var i=0;i<axos.length;i++)for(var j=i+1;j<axos.length;j++){
    var a=axos[i],b=axos[j];
    if(Math.abs(a.r-b.r)<=1&&Math.abs(a.c-b.c)<=1){conf.add(a.k);conf.add(b.k);}
  }
  for(var r2=0;r2<N;r2++)for(var c2=0;c2<N;c2++)
    cellEls[r2][c2].classList.toggle('conflict',conf.has(r2+','+c2));
  return conf.size;
}
function checkWin(){
  if(won||!G)return;
  var n=0;
  for(var r=0;r<G.N;r++)for(var c=0;c<G.N;c++)if(G.board[r][c]===1)n++;
  if(n===G.N&&validate()===0){won=true;setTimeout(doWin,550);}
}
function doWin(){
  var stars=3;
  if(mistakes>2||hintsUsed>1)stars=1;
  else if(mistakes>0||hintsUsed>0)stars=2;
  var bonus=100+stars*25,fishGain=isDaily?3:1;
  S.fish+=fishGain;
  refillHints();if(S.hints.count<5)S.hints.count++;
  if(isDaily){
    S.daily[todayStr()]=true;
    var y=new Date();y.setDate(y.getDate()-1);
    var ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    S.streak=(S.lastDaily===ys)?S.streak+1:1;S.lastDaily=todayStr();
    bonus+=25*S.streak;
  }else{
    S.stars[levelNum]=Math.max(S.stars[levelNum]||0,stars);
    S.level=Math.max(S.level,levelNum+1);
  }
  addScore(bonus,false);save();
  updateCounters();updateHintBtn();updateDailyBtn();
  sfx('win');confetti();
  showWinModal(stars,bonus,fishGain);
}
function showWinModal(stars,bonus,fishGain){
  $('#winTitle').textContent=isDaily?t('dailyWinTitle'):t('winTitle');
  var s='';
  for(var i=1;i<=3;i++)s+='<span class="'+(i<=stars?'on':'off')+'">★</span>';
  $('#winStars').innerHTML=s;
  $('#winStats').innerHTML='+'+bonus+' '+t('score').toLowerCase()+'<br>🐟 +'+fishGain+' '+t('fishEarned')+
    '<br>🔥 '+t('streak')+': '+S.streak;
  $('#btnNext').textContent=t('next');
  $('#btnReplay').textContent=t('replay');
  $('#winModal').classList.add('show');
  for(var i2=0;i2<stars;i2++)(function(d){setTimeout(function(){sfx('star');},400+d*200);})(i2);
}
function useHint(){
  if(won||!G)return;
  refillHints();
  if(S.hints.count<=0){toast(t('noHints'));sfx('error');return;}
  var cand=[];
  G.solution.forEach(function(k){
    var p=k.split(','),r=+p[0],c=+p[1];
    if(G.board[r][c]!==1)cand.push({r:r,c:c});
  });
  if(!cand.length)return;
  var pick=cand[(Math.random()*cand.length)|0];
  if(G.board[pick.r][pick.c]===3)G.clueCells.delete(pick.r+','+pick.c);
  S.hints.count--;hintsUsed++;save();updateHintBtn();
  setCell(pick.r,pick.c,1);
  toast(t('hintUsed'));
}
function undo(){
  if(won||!G)return;
  var m=undoStack.pop();
  if(!m)return;
  G.board[m.r][m.c]=m.prev;
  if(m.prev===3)G.clueCells.add(m.r+','+m.c);
  if(m.next===3)G.clueCells.delete(m.r+','+m.c);
  refreshCell(m.r,m.c);validate();updateCounters();sfx('tick');
}
function resetLevel(){
  if(won||!G)return;
  undoStack=[];
  for(var r=0;r<G.N;r++)for(var c=0;c<G.N;c++){
    var k=r+','+c;
    if(G.locked.has(k))G.board[r][c]=1;
    else if(clueOrig.has(k)){G.board[r][c]=3;G.clueCells.add(k);}
    else{G.board[r][c]=0;G.clueCells.delete(k);}
  }
  refreshAllCells();validate();updateCounters();sfx('tick');
}
</script>

<script>
'use strict';
/* ================= audio (WebAudio, no files) ================= */
var AC=null;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC)return;
  try{
    var t0=AC.currentTime+(delay||0);
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfx(name){
  if(!AC)return;
  if(name==='place'){tone(520,880,0.09,'sine',0.18);tone(1174,1568,0.07,'sine',0.07,0.03);}
  else if(name==='remove'){tone(430,230,0.09,'sine',0.13);}
  else if(name==='tick'){tone(1500,1100,0.045,'square',0.045);}
  else if(name==='error'){tone(220,140,0.16,'square',0.1);}
  else if(name==='click'){tone(700,950,0.05,'sine',0.07);}
  else if(name==='star'){tone(880,1760,0.14,'sine',0.11);}
  else if(name==='win'){var ns=[523,659,784,1047,1319];for(var i=0;i<ns.length;i++)tone(ns[i],ns[i],0.17,'triangle',0.15,i*0.11);}
}

/* ================= confetti ================= */
function confetti(){
  var cv=$('#confetti'),ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display='block';
  var cols=['#FF6FA5','#FFD166','#8CE8C0','#7FC8F8','#C4B5FD','#FF9F68','#F7A8C4'];
  var ps=[];
  for(var i=0;i<150;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length],
    vy:2+Math.random()*3.2,vx:-1.5+Math.random()*3,rot:Math.random()*6.28,vr:-0.12+Math.random()*0.24});
  var t0=performance.now();
  (function frame(){
    var el=performance.now()-t0;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<ps.length;i++){var p=ps[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
    if(el<3400)requestAnimationFrame(frame);else cv.style.display='none';
  })();
}

/* ================= rule mini diagrams ================= */
function miniCell(bg,inner){return '<div style="background:'+bg+'">'+(inner||'')+'</div>';}
function buildMinis(){
  var F='<img src="'+FACE_SRC+'" alt="">',h,r,c;
  h='';var lay=[['#B9F0C8','#B9F0C8','#FFE08A'],['#B9F0C8','#FFE08A','#FFE08A'],['#FFE08A','#FFE08A','#FFE08A']];
  var done=false;
  for(r=0;r<3;r++)for(c=0;c<3;c++){var inn='';if(lay[r][c]==='#B9F0C8'&&!done){inn=F;done=true;}h+=miniCell(lay[r][c],inn);}
  $('#mini1').innerHTML=h;
  h='';
  for(r=0;r<3;r++)for(c=0;c<3;c++)h+=miniCell(r===1?'#A9DDFB':'#F3E8CF',(r===1&&c===1)?F:'');
  $('#mini2').innerHTML=h;
  h='';
  for(r=0;r<3;r++)for(c=0;c<3;c++)h+=miniCell('#F3E8CF',((r===0&&c===0)||(r===1&&c===1))?F:'');
  var m3=$('#mini3');m3.innerHTML=h;m3.style.position='relative';
  var ban=document.createElement('div');ban.className='ban';ban.textContent='✕';m3.appendChild(ban);
}

/* ================= i18n UI ================= */
function buildHowto(){
  $('#howSteps').innerHTML=['step1','step2','step3','step4','step5'].map(function(k,i){
    return '<div class="howstep"><div class="n">'+(i+1)+'</div><div>'+t(k)+'</div></div>';
  }).join('');
}
function applyI18n(){
  var els=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++)els[i].textContent=t(els[i].getAttribute('data-i18n'));
  document.documentElement.lang=S.lang;
  document.title='AXO PUZZLE — '+t('subtitle');
  $('#langBtn').textContent=(S.lang==='es')?'EN':'ES';
  $('#undoBtn').title=t('undo');$('#axoBtn').title=t('axoMode');
  $('#hintBtn').title=t('hint');$('#resetBtn').title=t('reset');
  buildMinis();buildHowto();updateDailyBtn();
  if(G)updateCounters();
}

/* ================= wiring ================= */
$('#langBtn').addEventListener('click',function(){ensureAudio();sfx('click');S.lang=(S.lang==='es')?'en':'es';save();applyI18n();});
$('#undoBtn').addEventListener('click',function(){ensureAudio();undo();});
$('#resetBtn').addEventListener('click',function(){ensureAudio();resetLevel();});
$('#hintBtn').addEventListener('click',function(){ensureAudio();useHint();});
$('#axoBtn').addEventListener('click',function(){
  ensureAudio();axoMode=!axoMode;
  $('#axoBtn').classList.toggle('active',axoMode);
  toast(t(axoMode?'axoModeOn':'axoModeOff'));sfx('click');
});
$('#dailyBtn').addEventListener('click',function(){ensureAudio();sfx('click');loadLevel(1,true);});
$('#howtoBtn').addEventListener('click',function(){ensureAudio();sfx('click');$('#howtoModal').classList.add('show');});
$('#btnPlay').addEventListener('click',function(){ensureAudio();sfx('click');S.seenHowto=true;save();$('#howtoModal').classList.remove('show');});
$('#btnNext').addEventListener('click',function(){ensureAudio();sfx('click');
  if(isDaily)loadLevel(S.level,false);else loadLevel(levelNum+1,false);});
$('#btnReplay').addEventListener('click',function(){ensureAudio();sfx('click');loadLevel(levelNum,isDaily);});

/* ================= self-test (?test=1) ================= */
function findEmpty(){for(var r=0;r<G.N;r++)for(var c=0;c<G.N;c++)if(G.board[r][c]===0)return {r:r,c:c};return null;}
function adjEmpty(a){var ds=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<4;i++){var r=a.r+ds[i][0],c=a.c+ds[i][1];
    if(r>=0&&r<G.N&&c>=0&&c<G.N&&G.board[r][c]===0)return {r:r,c:c};}return null;}
function tlog(ok,name,info){
  $('#testout').textContent+=(ok?'PASS':'FAIL')+' '+name+(info?' ['+info+']':'')+'\n';
  return ok;
}
async function runTests(){
  document.body.classList.add('test');
  var pass=0,fail=0;
  function ck(c,n,i){if(tlog(c,n,i))pass++;else fail++;}
  function wait(ms){return new Promise(function(res){setTimeout(res,ms);});}
  try{
    var sizes=[7,8,9];
    for(var si=0;si<sizes.length;si++){
      var N=sizes[si],t0=performance.now();
      var p=generatePuzzle(N,N===9?1:2,0,mulberry32(4242+N));
      var ms=Math.round(performance.now()-t0);
      ck(!!p,'gen N='+N+' unique',ms+'ms');
      if(p)ck(countSolsGivens(N,p.regions,p.givens,2)===1,'verify unique N='+N,'');
    }
    loadLevel(1,false);await wait(60);
    ck(G&&G.N===7&&cellEls.length===7&&cellEls[0].length===7,'board 7x7 renders',(G?G.N:'?')+'x'+(G?G.N:'?'));
    var e=findEmpty();
    tapCell(e.r,e.c);ck(G.board[e.r][e.c]===2,'tap1 empty->X','');
    tapCell(e.r,e.c);ck(G.board[e.r][e.c]===1,'tap2 X->axolotl','');
    tapCell(e.r,e.c);ck(G.board[e.r][e.c]===0,'tap3 axolotl->empty','');
    longPressCell(e.r,e.c);ck(G.board[e.r][e.c]===1,'longpress -> axolotl','');
    setCell(e.r,e.c,0,{skipWin:true});
    var a=findEmpty(),nb=adjEmpty(a);
    ck(!!(a&&nb),'two adjacent empties exist','');
    setCell(a.r,a.c,1,{skipWin:true});setCell(nb.r,nb.c,1,{skipWin:true});
    ck(cellEls[a.r][a.c].classList.contains('conflict'),'conflict highlighted','');
    setCell(a.r,a.c,0,{skipWin:true});setCell(nb.r,nb.c,0,{skipWin:true});
    ck(validate()===0,'conflict cleared','');
    tapCell(e.r,e.c);var ul=undoStack.length;undo();
    ck(undoStack.length===ul-1&&G.board[e.r][e.c]===0,'undo restores','');
    refillHints();S.hints.count=3;var h0=S.hints.count;useHint();
    ck(S.hints.count===h0-1,'hint consumed','');
    resetLevel();
    G.solution.forEach(function(k){var q=k.split(','),r=+q[0],c=+q[1];
      if(G.board[r][c]!==1)setCell(r,c,1,{skipWin:true});});
    checkWin();await wait(1100);
    ck(won===true,'win triggered','');
    ck($('#winModal').classList.contains('show'),'win modal visible','');
    ck(S.fish>=1,'fish earned',String(S.fish));
    $('#btnNext').click();await wait(100);
    ck(!isDaily&&levelNum===2&&G&&G.N===7,'next level loads','L'+levelNum+' '+(G?G.N:'?'));
    loadLevel(1,true);await wait(60);
    ck(isDaily&&G.N===9,'daily 9x9 loads','');
    ck($('#levelVal').textContent===t('daily'),'daily label',$('#levelVal').textContent);
    ck($('#axoCount').textContent.indexOf('/9')>-1,'counter shows /9',$('#axoCount').textContent);
  }catch(err){tlog(false,'exception',String((err&&err.message)||err));fail++;}
  var total=pass+fail;
  $('#testout').textContent+='\nRESULT '+pass+'/'+total+(fail?' FAIL':' PASS')+'\n';
  document.title='AXOTEST:'+pass+'/'+total+(fail?' FAIL':' PASS');
}

/* ================= init ================= */
function init(){
  refillHints();
  applyI18n();
  loadLevel(S.level||1,false);
  if(TEST){S.seenHowto=true;runTests();}
  else if(!S.seenHowto){$('#howtoModal').classList.add('show');}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
